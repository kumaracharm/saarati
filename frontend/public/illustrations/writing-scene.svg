<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 350" width="740" height="350" role="img" aria-hidden="true">
  <!-- Background -->
  <rect x="0" y="0" width="740" height="350" fill="#f3f4f6"/>

  <!-- Outline picture frames with cross lines -->
  <g fill="#ffffff" stroke="#7c3aed" stroke-width="6">
    <rect x="50" y="60" width="120" height="90"/>
    <rect x="610" y="40" width="110" height="80"/>
  </g>
  <g stroke="#7c3aed" stroke-width="3" fill="none">
    <line x1="110" y1="60" x2="110" y2="150"/>
    <line x1="50" y1="105" x2="170" y2="105"/>
    <line x1="665" y1="40" x2="665" y2="120"/>
    <line x1="610" y1="80" x2="720" y2="80"/>
  </g>

  <!-- Purple-striped panel -->
  <rect x="240" y="60" width="90" height="230" fill="#a855f7"/>
  <g fill="#7c3aed">
    <rect x="252" y="60" width="8" height="230"/>
    <rect x="272" y="60" width="8" height="230"/>
    <rect x="292" y="60" width="8" height="230"/>
    <rect x="312" y="60" width="8" height="230"/>
  </g>

  <!-- Pink/purple patterned pillar -->
  <rect x="345" y="80" width="50" height="220" fill="#f9a8d4"/>
  <g fill="#a855f7">
    <polygon points="370,88 380,100 370,112 360,100"/>
    <polygon points="370,128 380,140 370,152 360,140"/>
    <polygon points="370,168 380,180 370,192 360,180"/>
    <polygon points="370,208 380,220 370,232 360,220"/>
    <polygon points="370,248 380,260 370,272 360,260"/>
  </g>

  <!-- Mint-green plants -->
  <rect x="20" y="270" width="40" height="30" rx="4" fill="#7c3aed"/>
  <ellipse cx="30" cy="240" rx="12" ry="30" fill="#6ee7b7" transform="rotate(-20 30 240)"/>
  <ellipse cx="48" cy="245" rx="10" ry="26" fill="#6ee7b7" transform="rotate(20 48 245)"/>
  <rect x="680" y="270" width="40" height="30" rx="4" fill="#7c3aed"/>
  <ellipse cx="690" cy="235" rx="12" ry="30" fill="#6ee7b7" transform="rotate(-15 690 235)"/>
  <ellipse cx="708" cy="240" rx="10" ry="26" fill="#6ee7b7" transform="rotate(20 708 240)"/>
  <ellipse cx="425" cy="280" rx="10" ry="22" fill="#6ee7b7" transform="rotate(-25 425 280)"/>
  <ellipse cx="440" cy="282" rx="9" ry="20" fill="#6ee7b7" transform="rotate(20 440 282)"/>

  <!-- Man: chair -->
  <rect x="100" y="120" width="12" height="130" fill="#7c3aed"/>
  <rect x="100" y="240" width="110" height="10" rx="3" fill="#7c3aed"/>
  <rect x="104" y="250" width="8" height="50" fill="#7c3aed"/>
  <rect x="196" y="250" width="8" height="50" fill="#7c3aed"/>

  <!-- Man: legs (yellow-orange trousers), shoes -->
  <rect x="118" y="218" width="84" height="26" rx="6" fill="#f97316"/>
  <rect x="186" y="240" width="22" height="52" rx="5" fill="#f97316"/>
  <rect x="180" y="290" width="34" height="10" rx="4" fill="#1e1b4b"/>
  <rect x="112" y="236" width="14" height="10" rx="4" fill="#1e1b4b"/>

  <!-- Man: torso (black t-shirt) and head -->
  <rect x="115" y="128" width="52" height="92" rx="10" fill="#1e1b4b"/>
  <circle cx="140" cy="102" r="22" fill="#fcd9b8"/>
  <path d="M118 96 Q120 74 141 74 Q162 74 162 96 Q152 84 140 84 Q126 84 118 96 Z" fill="#1e1b4b"/>

  <!-- Man: arm on knee and arm holding tall pen -->
  <line x1="125" y1="140" x2="122" y2="200" stroke="#1e1b4b" stroke-width="14" stroke-linecap="round"/>
  <line x1="150" y1="140" x2="196" y2="188" stroke="#1e1b4b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="122" cy="206" r="7" fill="#fcd9b8"/>
  <line x1="198" y1="190" x2="232" y2="40" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round"/>
  <line x1="232" y1="40" x2="235" y2="24" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <circle cx="198" cy="190" r="7" fill="#fcd9b8"/>

  <!-- Woman: large cushion -->
  <rect x="500" y="262" width="170" height="40" rx="18" fill="#a855f7"/>

  <!-- Woman: legs and blue sneakers -->
  <rect x="618" y="254" width="16" height="36" rx="6" fill="#fcd9b8"/>
  <rect x="640" y="250" width="18" height="40" rx="6" fill="#fcd9b8"/>
  <rect x="614" y="286" width="28" height="12" rx="5" fill="#2563eb"/>
  <rect x="636" y="286" width="28" height="12" rx="5" fill="#2563eb"/>

  <!-- Woman: purple skirt -->
  <path d="M548 200 L642 200 L662 262 L528 262 Z" fill="#7c3aed"/>

  <!-- Woman: lilac top -->
  <rect x="556" y="150" width="62" height="54" rx="10" fill="#c4b5fd"/>

  <!-- Woman: dark hair and head -->
  <circle cx="587" cy="118" r="25" fill="#1e1b4b"/>
  <circle cx="589" cy="124" r="19" fill="#fcd9b8"/>
  <path d="M566 118 Q570 96 590 96 Q612 96 610 120 L612 140 L598 124 L578 124 L566 140 Z" fill="#1e1b4b"/>

  <!-- Woman: arms and white sheet of paper on knee -->
  <line x1="565" y1="158" x2="600" y2="220" stroke="#c4b5fd" stroke-width="13" stroke-linecap="round"/>
  <line x1="612" y1="158" x2="618" y2="214" stroke="#c4b5fd" stroke-width="13" stroke-linecap="round"/>
  <g transform="rotate(-8 622 226)">
    <rect x="596" y="206" width="52" height="40" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="603" y1="216" x2="641" y2="216" stroke="#d1d5db" stroke-width="2"/>
    <line x1="603" y1="224" x2="641" y2="224" stroke="#d1d5db" stroke-width="2"/>
    <line x1="603" y1="232" x2="630" y2="232" stroke="#d1d5db" stroke-width="2"/>
  </g>
  <circle cx="600" cy="222" r="6" fill="#fcd9b8"/>
  <circle cx="618" cy="216" r="6" fill="#fcd9b8"/>

  <!-- Thin dark ground line -->
  <line x1="0" y1="300" x2="740" y2="300" stroke="#1e1b4b" stroke-width="2"/>
</svg>
